<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
  background:white;
  color:black;
  font-family:serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
}

#text{
  font-size:22px;
}

.glitch{
  animation: glitch 0.15s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  25%{transform:translate(1px,-1px);}
  50%{transform:translate(-1px,1px);}
  75%{transform:translate(1px,1px);}
  100%{transform:translate(0);}
}
</style>
</head>

<body>

<div id="text"></div>

<script>
const text = '"리디큘러스."';
let i = 0;

function type(){
  if(i < text.length){
    document.getElementById("text").innerHTML += text[i];
    i++;
    setTimeout(type, 120);
  } else {

   else {

  document.body.classList.add("glitch");

  // ✔ 1초 뒤 이동
  setTimeout(() => {
    localStorage.setItem("stage", "ending");
    window.location.href = "ending.html";
  }, 1000);

}

type();
</script>

</body>
</html>
