<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
  background: white;
  color: black;
  font-family: serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  padding: 60px;
}

#ridikulus {
  opacity: 0;
  transition: opacity 2.5s ease-in;
}
</style>

</head>

<body>

<div style="max-width:700px;">

<p>
지팡이를 들어올린다,<br>
동그랗게 뜬 눈이 암흑 속을 응시한다,<br>
나의 친구. 나의 성장을 두려워하는 나의 어린 시절.
</p>

<br>

<p id="ridikulus">"리디큘러스."</p>

<br>

<p>
눈 세개 짜리의 맨티코어 유체는 일그러져서 스우핑 이블이 되었고.<br>
이어 그것이 일그러져 나비와 꽃내음이 된다.
</p>

</div>

<script>
// 살짝 지연 후 "모래에서 드러나는 느낌"
setTimeout(() => {
  document.getElementById("ridikulus").style.opacity = 1;
}, 1200);

// stage 진행
localStorage.setItem("stage", "ending");
</script>

</body>
</html>
