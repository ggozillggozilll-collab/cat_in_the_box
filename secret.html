<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body style="
background:white;
color:black;
font-family:serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
">

<div id="text"></div>

<script>
const text = '"리디큘러스."';
let i = 0;

function type(){
  if(i < text.length){
    document.getElementById("text").innerHTML += text[i];
    i++;
    setTimeout(type, 120);
  } else {

    // ✔ 그냥 1초 후 이동
    setTimeout(() => {
      localStorage.setItem("stage","ending");
      window.location.href = "ending.html";
    }, 1000);

  }
}

type();
</script>

</body>
</html>
