<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body style="
background:white;
color:black;
font-family:serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
padding:60px;
">

<div style="max-width:800px;">

<p>
처음의 기억은 까만 상자 속이었다, 눈을 떠 본 것이라곤 끝없는 어둠.<br>
지쳐 잠에 들면 벽 너머로부터 말소리가 들렸다.
</p>

<br>

<p>
"어떡해요, 캐트시가 안에 있어요... 우리 아들이 안에 있어요."<br>
처참하게 무너진 어른들의 목소리<br>
목소리?
</p>

<br>

<p>
보가트는 목소리를 낼 수 없다, 그런 것 까지 따라하지 못한다.<br>
그럼 이건. 내 꿈인가. 꿈을 꾸는 기분이 들기도 한다.
</p>

</div>

<script>
// 상태 기반 새로고침 진행 구조
const stage = localStorage.getItem("stage");

// 처음 진입이면 stage 설정
if (!stage || stage === "page1") {
  localStorage.setItem("stage", "missing");
}

// 새로고침/재접속 시 자동 이동
if (stage === "missing") {
  window.location.href = "missing.html";
}
</script>

</body>
