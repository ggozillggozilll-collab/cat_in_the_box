<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
  background:white;
  color:black;
  font-family:serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
}

#text{
  font-size:22px;
  white-space:pre-wrap;
}

.cursor{
  display:inline-block;
  animation: blink 0.8s infinite;
}

@keyframes blink{
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}
</style>
</head>

<body>

<div id="text"></div><span class="cursor">|</span>

<script>
const text = "내가 처음 맞이한 세상은...";

let i = 0;
const el = document.getElementById("text");

function type(){
  if(i < text.length){
    el.innerHTML += text[i];
    i++;
    setTimeout(type, 120);
  }
}

type();
</script>

</body>
</html>
