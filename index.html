<p>

<br><br>

<button onclick="openBox()" style="

</button>

<button onclick="denyBox()" style="

">

</button>

<script>
function openBox() {
  localStorage.setItem("box_opened", "true");
  localStorage.setItem("stage", "page1");
  window.location.href = "page1.html";
}

function denyBox() {
  localStorage.setItem("box_opened", "false");
  window.location.href = "ending.html";
}
</script>
