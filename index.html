<!DOCTYPE html>

<body style="background:black;color:white;font-family:serif;text-align:center;padding:60px;">

<p>
상자 속 고양이.<br>
상자를 열면 고양이는 죽는다.
</p>

<br>

<button onclick="openBox()">상자를 연다</button>
<button onclick="leaveBox()">방치한다</button>

<script>
function openBox(){
  localStorage.setItem("route","open");
  window.location.href = "page1.html";
}

function leaveBox(){
  localStorage.setItem("route","ignore");
  window.location.href = "ending2.html";
}
</script>
